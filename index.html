<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UAGro - Simulador de la Ecuación de la Recta</title>
  <style>
    :root {
      --uagro-blue: #1b365d;
      --uagro-blue-dark: #10233f;
      --uagro-gold: #c59b27;
      --uagro-red: #c53030;
      --bg: #f1f5f9;
      --panel-bg: #ffffff;
      --text: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Encabezado Institucional UAGro */
    .header-uagro {
      background: linear-gradient(135deg, var(--uagro-blue-dark), var(--uagro-blue));
      color: #ffffff;
      width: 100%;
      max-width: 1000px;
      padding: 20px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      border-bottom: 4px solid var(--uagro-gold);
      margin-bottom: 20px;
    }

    .logo.png {
      height: 85px;
      width: auto;
      object-fit: contain;
      background: #ffffff;
      padding: 4px;
      border-radius: 50%;
      border: 2px solid var(--uagro-gold);
    }

    .header-titles h2 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--uagro-gold);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .header-titles h1 {
      font-size: 1.4rem;
      font-weight: 700;
    }

    .author-subtitle {
      font-size: 0.95rem;
      font-weight: 500;
      color: #e2e8f0;
      font-style: italic;
      margin-top: 6px;
    }

    /* Contenedor Principal */
    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      max-width: 1000px;
      width: 100%;
    }

    .canvas-card {
      background: var(--panel-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    canvas {
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      cursor: crosshair;
      background-color: #ffffff;
    }

    .controls-card {
      background: var(--panel-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      flex: 1;
      min-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      border-top: 4px solid var(--uagro-blue);
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-weight: 600;
      font-size: 0.9rem;
      display: flex;
      justify-content: space-between;
      color: var(--uagro-blue);
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--uagro-blue);
      cursor: pointer;
    }

    /* Caja de Ecuaciones */
    .equations-box {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-left: 5px solid var(--uagro-gold);
      padding: 16px;
      border-radius: 0 8px 8px 0;
      margin-top: 10px;
    }

    .equation-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 15px;
      margin-bottom: 6px;
    }

    .equation-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--uagro-blue);
      font-weight: 700;
    }

    .equation-value {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 1.15rem;
      font-weight: bold;
      color: #0f172a;
      margin-top: 4px;
      margin-bottom: 8px;
      background: #ffffff;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #cbd5e1;
    }

    /* Control Checkbox */
    .toggle-label {
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--uagro-blue);
      background: #e2e8f0;
      padding: 3px 8px;
      border-radius: 4px;
      user-select: none;
    }

    .toggle-label input {
      accent-color: var(--uagro-blue);
      cursor: pointer;
      width: 15px;
      height: 15px;
    }

    .instructions {
      font-size: 0.85rem;
      color: #64748b;
      margin-top: 10px;
      text-align: center;
    }

    @media (max-width: 600px) {
      .header-uagro {
        flex-direction: column;
        text-align: center;
      }
      .logo.png {
        height: 70px;
      }
    }
  </style>
</head>
<body>

  <!-- Encabezado con Logo y Colores UAGro -->
  <header class="header-uagro">
    <img src="uagro-logo.png" alt="Escudo UAGro" class="logo-uagro">
    <div class="header-titles">
      <h2>Universidad Autónoma de Guerrero</h2>
      <h1>Simulador Interactivo: Ecuación de la Recta</h1>
      <p class="author-subtitle">Desarrollado por: Andrés Manuel Hernández Bustos</p>
    </div>
  </header>

  <div class="container">
    <div class="canvas-card">
      <canvas id="gridCanvas" width="460" height="460"></canvas>
      <p class="instructions">Arrastra directamente el punto rojo <b>A(x₁, y₁)</b> dentro del plano cartesiano.</p>
    </div>

    <div class="controls-card">
      <div class="control-group">
        <label for="slopeSlider">
          Pendiente (m): <span id="slopeValue" style="color:var(--uagro-blue)">1.50</span>
        </label>
        <input type="range" id="slopeSlider" min="-5" max="5" step="0.1" value="1.5">
      </div>

      <div class="control-group">
        <label for="x1Slider">
          Coordenada x₁: <span id="x1Value" style="color:var(--uagro-red)">2.00</span>
        </label>
        <input type="range" id="x1Slider" min="-8" max="8" step="0.5" value="2">
      </div>

      <div class="control-group">
        <label for="y1Slider">
          Coordenada y₁: <span id="y1Value" style="color:var(--uagro-red)">1.00</span>
        </label>
        <input type="range" id="y1Slider" min="-8" max="8" step="0.5" value="1">
      </div>

      <div class="equations-box">
        <div class="equation-title">Forma Punto-Pendiente</div>
        <div class="equation-value" id="pointSlopeEq">(y - y₁) = m(x - x₁)</div>

        <!-- Encabezado con Casilla para Mostrar/Ocultar -->
        <div class="equation-header">
          <div class="equation-title">Forma Pendiente-Ordenada</div>
          <label class="toggle-label">
            <input type="checkbox" id="toggleSlopeIntercept">
            Mostrar
          </label>
        </div>

        <!-- Oculta por defecto (display: none) -->
        <div class="equation-value" id="slopeInterceptEq" style="display: none;">y = mx + b</div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gridCanvas');
    const ctx = canvas.getContext('2d');

    const slopeSlider = document.getElementById('slopeSlider');
    const x1Slider = document.getElementById('x1Slider');
    const y1Slider = document.getElementById('y1Slider');

    const slopeValueText = document.getElementById('slopeValue');
    const x1ValueText = document.getElementById('x1Value');
    const y1ValueText = document.getElementById('y1Value');

    const pointSlopeEqText = document.getElementById('pointSlopeEq');
    const slopeInterceptEqText = document.getElementById('slopeInterceptEq');
    const toggleSlopeIntercept = document.getElementById('toggleSlopeIntercept');

    const gridRange = 10;
    let width = canvas.width;
    let height = canvas.height;
    let scale = width / (2 * gridRange);

    let m = parseFloat(slopeSlider.value);
    let x1 = parseFloat(x1Slider.value);
    let y1 = parseFloat(y1Slider.value);

    let isDragging = false;

    // Escuchar el cambio en la casilla para mostrar u ocultar la ecuación
    toggleSlopeIntercept.addEventListener('change', (e) => {
      slopeInterceptEqText.style.display = e.target.checked ? 'block' : 'none';
    });

    function toScreenX(x) { return width / 2 + x * scale; }
    function toScreenY(y) { return height / 2 - y * scale; }
    function toMathX(px) { return (px - width / 2) / scale; }
    function toMathY(py) { return (height / 2 - py) / scale; }

    function drawGrid() {
      ctx.clearRect(0, 0, width, height);

      // Rejilla Secundaria
      ctx.strokeStyle = '#e2e8f0';
      ctx.lineWidth = 1;

      for (let i = -gridRange; i <= gridRange; i++) {
        ctx.beginPath();
        ctx.moveTo(toScreenX(i), 0);
        ctx.lineTo(toScreenX(i), height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, toScreenY(i));
        ctx.lineTo(width, toScreenY(i));
        ctx.stroke();
      }

      // Ejes Principales
      ctx.strokeStyle = '#1b365d';
      ctx.lineWidth = 2;

      ctx.beginPath();
      ctx.moveTo(0, toScreenY(0));
      ctx.lineTo(width, toScreenY(0));
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(toScreenX(0), 0);
      ctx.lineTo(toScreenX(0), height);
      ctx.stroke();

      // Numeración del plano
      ctx.fillStyle = '#64748b';
      ctx.font = '10px sans-serif';
      for (let i = -gridRange; i <= gridRange; i++) {
        if (i !== 0) {
          ctx.fillText(i, toScreenX(i) - 6, toScreenY(0) + 14);
          ctx.fillText(i, toScreenX(0) + 6, toScreenY(i) + 4);
        }
      }
    }

    function drawLineAndPoint() {
      const b = y1 - m * x1;
      const xStart = -gridRange;
      const yStart = m * xStart + b;
      const xEnd = gridRange;
      const yEnd = m * xEnd + b;

      // Dibujar la Recta
      ctx.strokeStyle = '#1b365d';
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.moveTo(toScreenX(xStart), toScreenY(yStart));
      ctx.lineTo(toScreenX(xEnd), toScreenY(yEnd));
      ctx.stroke();

      // Dibujar Punto A(x1, y1)
      ctx.fillStyle = '#c53030';
      ctx.beginPath();
      ctx.arc(toScreenX(x1), toScreenY(y1), 8, 0, 2 * Math.PI);
      ctx.fill();

      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Etiqueta del Punto
      ctx.fillStyle = '#10233f';
      ctx.font = 'bold 12px sans-serif';
      ctx.fillText(`A(${x1.toFixed(1)}, ${y1.toFixed(1)})`, toScreenX(x1) + 10, toScreenY(y1) - 10);
    }

    function updateEquations() {
      const b = y1 - m * x1;

      slopeValueText.textContent = m.toFixed(2);
      x1ValueText.textContent = x1.toFixed(1);
      y1ValueText.textContent = y1.toFixed(1);

      // Forma Punto-Pendiente
      let yPart = y1 >= 0 ? `(y - ${y1.toFixed(1)})` : `(y + ${Math.abs(y1).toFixed(1)})`;
      let xPart = x1 >= 0 ? `(x - ${x1.toFixed(1)})` : `(x + ${Math.abs(x1).toFixed(1)})`;
      pointSlopeEqText.textContent = `${yPart} = ${m.toFixed(2)}${xPart}`;

      // Forma Pendiente-Ordenada
      let bPart = b >= 0 ? ` + ${b.toFixed(2)}` : ` - ${Math.abs(b).toFixed(2)}`;
      slopeInterceptEqText.textContent = `y = ${m.toFixed(2)}x${bPart}`;
    }

    function render() {
      drawGrid();
      drawLineAndPoint();
      updateEquations();
    }

    slopeSlider.addEventListener('input', (e) => { m = parseFloat(e.target.value); render(); });
    x1Slider.addEventListener('input', (e) => { x1 = parseFloat(e.target.value); render(); });
    y1Slider.addEventListener('input', (e) => { y1 = parseFloat(e.target.value); render(); });

    function handlePointerDown(px, py) {
      const mx = toMathX(px);
      const my = toMathY(py);
      if (Math.hypot(mx - x1, my - y1) < 1.2) isDragging = true;
    }

    function handlePointerMove(px, py) {
      if (isDragging) {
        x1 = Math.max(-gridRange, Math.min(gridRange, toMathX(px)));
        y1 = Math.max(-gridRange, Math.min(gridRange, toMathY(py)));
        x1Slider.value = x1;
        y1Slider.value = y1;
        render();
      }
    }

    canvas.addEventListener('mousedown', (e) => {
      const rect = canvas.getBoundingClientRect();
      handlePointerDown(e.clientX - rect.left, e.clientY - rect.top);
    });

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      handlePointerMove(e.clientX - rect.left, e.clientY - rect.top);
    });

    window.addEventListener('mouseup', () => { isDragging = false; });

    // Soporte táctil
    canvas.addEventListener('touchstart', (e) => {
      const rect = canvas.getBoundingClientRect();
      const touch = e.touches[0];
      handlePointerDown(touch.clientX - rect.left, touch.clientY - rect.top);
    }, {passive: true});

    canvas.addEventListener('touchmove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const touch = e.touches[0];
      handlePointerMove(touch.clientX - rect.left, touch.clientY - rect.top);
    }, {passive: true});

    window.addEventListener('touchend', () => { isDragging = false; });

    render();
  </script>
</body>
</html>
